# Workspace 
windowrule {
  name = windowrule-30
  workspace = 2
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-31
  workspace = 3
  match:class = ^(org.telegram.desktop)$
}

windowrule {
  name = windowrule-32
  workspace = 4
  match:class = ^(Code)$
}

windowrule {
  name = windowrule-33
  workspace = 4
  match:class = ^(code-url-handler)$
}


# Size
windowrule {
  name = windowrule-34
  size = 800 600
  match:title = ^(Save File)$
}


windowrule {
  name = windowrule-35
  idle_inhibit = focus
  match:class = ^(mpv)$
}


# xwaylandvideobridge
windowrule {
  name = windowrule-36
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_focus = on
  no_initial_focus = on
  match:class = ^(xwaylandvideobridge)$
}

